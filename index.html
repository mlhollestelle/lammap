<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>lammap · traffic counters</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<script>
// Apply a saved theme before the page paints; without one the page follows the system setting.
try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  /* Off Hours design system tokens */
  :root {
    color-scheme: light;
    --surface: #f4f5f0;
    --surface-raised: #ffffff;
    --surface-sunken: #e9ebe4;
    --line: #d5d9cf;
    --line-strong: #78837c;
    --grid: #e2e5dc;
    --ink: #16201b;
    --ink-muted: #56625b;
    --on-ink: #f4f5f0;
    --pink: #ff5c93;
    --on-pink: #16201b;
    --pink-text: #c01e5b;
    --pink-soft: #ffe0eb;
    --moss: #1e6b47;
    --moss-soft: #dcefe4;
    --marker: #f2c230;
    --blue: #2d5bd0;
    --danger: #b42318;
    --disruption: #d1281b;
    --roadwork: #e06a00;
    --shadow-pop: 4px 4px 0 #16201b;
    --shadow-soft: 0 1px 2px rgba(22, 32, 27, 0.06), 0 8px 24px rgba(22, 32, 27, 0.06);
    --tile-filter: grayscale(1) contrast(0.95) brightness(1.03);
    --tile-opacity: 0.7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #111613;
      --surface-raised: #19201c;
      --surface-sunken: #0b0f0d;
      --line: #2a332e;
      --line-strong: #68756d;
      --grid: #1b231f;
      --ink: #e8ece5;
      --ink-muted: #9ba79f;
      --on-ink: #111613;
      --pink: #ff7faa;
      --pink-text: #ff94b8;
      --pink-soft: #40172a;
      --moss: #4cc38a;
      --moss-soft: #14301f;
      --marker: #e8b923;
      --blue: #86a8ff;
      --danger: #ff8a80;
      --disruption: #ff6b5b;
      --roadwork: #ff9a3c;
      --shadow-pop: 4px 4px 0 #ff7faa;
      --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
      --tile-filter: grayscale(1) invert(1) contrast(0.85) brightness(0.9);
      --tile-opacity: 0.75;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #111613;
    --surface-raised: #19201c;
    --surface-sunken: #0b0f0d;
    --line: #2a332e;
    --line-strong: #68756d;
    --grid: #1b231f;
    --ink: #e8ece5;
    --ink-muted: #9ba79f;
    --on-ink: #111613;
    --pink: #ff7faa;
    --pink-text: #ff94b8;
    --pink-soft: #40172a;
    --moss: #4cc38a;
    --moss-soft: #14301f;
    --marker: #e8b923;
    --blue: #86a8ff;
    --danger: #ff8a80;
    --disruption: #ff6b5b;
    --roadwork: #ff9a3c;
    --shadow-pop: 4px 4px 0 #ff7faa;
    --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    --tile-filter: grayscale(1) invert(1) contrast(0.85) brightness(0.9);
    --tile-opacity: 0.75;
  }
  :root {
    --font-display: "Bricolage Grotesque", "Geist", system-ui, sans-serif;
    --font-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius-sm: 4px;
    --radius-md: 10px;
    --radius-lg: 18px;
    --radius-pill: 999px;
    /* What the app draws, in the system's chart series order */
    --series-1: var(--pink);
    --series-2: var(--moss);
    --dir-1: var(--pink);
    --dir-2: var(--moss);
    --missing: var(--line);
    --station: var(--moss);
    --station-bike: var(--blue);
    --station-walk: var(--marker);
    --station-off: var(--line-strong);
    --station-sel: var(--pink);
    --lane-1: var(--pink);
    --lane-2: var(--moss);
    --lane-3: var(--blue);
    --lane-4: var(--marker);
    --lane-5: var(--ink-muted);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--surface);
    color: var(--ink);
    font: 15px/1.6 var(--font-sans);
    display: grid;
    grid-template-columns: 1fr 460px;
    grid-template-rows: 100%;
  }
  #map { height: 100%; }
  #panel {
    background: var(--surface);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 0 28px 24px;
    display: flex; flex-direction: column;
  }
  .head {
    margin: 0 -28px 8px;
    padding: 32px 28px 24px;
    border-bottom: 1px solid var(--line);
    /* The notebook grid */
    background-color: var(--surface);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 24px;
  }
  .brand { flex: 1; }
  .find { order: 3; flex-basis: 100%; }
  .label {
    font: 500 12px/16px var(--font-mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  h1 {
    font: 700 44px/1 var(--font-display);
    letter-spacing: -0.03em;
    margin: 8px 0 12px;
  }
  h2 {
    font: 700 28px/34px var(--font-display);
    letter-spacing: -0.02em;
    margin: 24px 0 4px;
    text-wrap: balance;
  }
  h3 {
    font: 600 19px/26px var(--font-display);
    letter-spacing: -0.01em;
    margin: 32px 0 4px;
  }
  .sub { color: var(--ink-muted); font-size: 13px; line-height: 20px; }
  .muted { color: var(--ink-muted); }
  #search {
    width: 100%; margin: 20px 0 0; padding: 0 14px; height: 42px;
    border: 1px solid var(--line-strong); border-radius: var(--radius-md);
    background: var(--surface-raised); color: var(--ink); font: inherit;
  }
  #search::placeholder { color: var(--ink-muted); }
  #results { list-style: none; margin: 4px 0 0; padding: 0; max-height: 220px; overflow-y: auto; background: var(--surface); }
  #results li { padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; }
  #results li:hover { background: var(--surface-sunken); }
  #results li.muted { cursor: default; background: none; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 20px; }
  .split-tile { grid-column: 1 / -1; }
  .split-tile .legend { margin-bottom: 0; }
  .tile {
    background: var(--surface-raised);
    border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 12px 14px;
  }
  .tile .v { font: 600 24px/30px var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .l { font: 500 11px/15px var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); margin-top: 4px; }
  .chart { position: relative; width: 100%; margin-top: 8px; }
  .chart svg { display: block; width: 100%; }
  .chart text { fill: var(--ink-muted); font-family: var(--font-mono); font-size: 10px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-muted); margin: 6px 0 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  #tip {
    position: fixed; pointer-events: none; z-index: 1000; display: none;
    background: var(--surface-raised); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 8px 12px; font-size: 13px; line-height: 20px; box-shadow: var(--shadow-soft);
    white-space: nowrap;
  }
  #tip b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .error { color: var(--danger); }
  button {
    font: 600 14px/1 var(--font-sans); padding: 0 14px; min-height: 36px; border-radius: var(--radius-md);
    border: 1px solid var(--line-strong); background: transparent; color: var(--ink); cursor: pointer;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  button:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: var(--shadow-pop); }
  button:active { transform: none; box-shadow: none; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--pink-text); outline-offset: 2px; }
  .seg {
    display: flex; margin-top: 16px; padding: 3px; gap: 3px;
    border: 1px solid var(--line-strong); border-radius: var(--radius-md);
  }
  .seg button {
    flex: 1; border: 0; border-radius: 7px; min-height: 34px; padding: 4px 8px;
    font-weight: 500; line-height: 1.25; color: var(--ink-muted);
  }
  .seg button:hover:not(:disabled) { transform: none; box-shadow: none; color: var(--ink); }
  .seg button[aria-pressed="true"], .seg button[aria-pressed="true"]:hover:not(:disabled) { background: var(--ink); color: var(--on-ink); font-weight: 600; }
  .seg button:disabled { cursor: default; opacity: .45; }
  .chart canvas { display: block; width: 100%; }
  .lanes { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
  .lanes button {
    min-height: 28px; padding: 0 12px; border-radius: var(--radius-pill);
    font: 500 12px/1 var(--font-mono); letter-spacing: 0.04em;
  }
  .lanes button:hover:not(:disabled) { transform: none; box-shadow: none; border-color: var(--ink); }
  .modes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .modes button {
    min-height: 26px; padding: 0 10px; border-radius: var(--radius-pill);
    font: 500 12px/1 var(--font-mono); letter-spacing: 0.04em;
  }
  .modes button:hover:not(:disabled) { transform: none; box-shadow: none; border-color: var(--ink); }
  .modes button i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .modes button[aria-pressed="false"] { opacity: .5; border-style: dashed; }
  .modes button[aria-pressed="false"] i { background: transparent !important; box-shadow: inset 0 0 0 1px var(--ink-muted); }
  .modes button i.line { width: 12px; height: 4px; border-radius: 2px; vertical-align: 1px; }
  .lanes-dir { align-self: center; font-weight: 600; margin-right: 4px; }
  .lanes button i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .lanes button[aria-pressed="false"] { opacity: .5; border-style: dashed; }
  .lanes button[aria-pressed="false"] i { background: transparent !important; box-shadow: inset 0 0 0 1px var(--ink-muted); }
  .live-dot {
    position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    box-shadow: 0 0 0 1px var(--surface), 0 0 0 2px var(--ink);
  }
  .live-dot::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit;
    animation: live-pulse 1.6s ease-out infinite;
  }
  .live-key { position: relative; display: inline-block; margin: 0 7px 0 5px; vertical-align: -1px; }
  @keyframes live-pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(3); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .live-dot::after { animation: none; }
    button { transition: none; }
    button:hover:not(:disabled) { transform: none; }
  }
  .split { display: flex; height: 10px; border-radius: var(--radius-pill); overflow: hidden; margin: 8px 0 4px; gap: 2px; }
  .foot { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; line-height: 18px; color: var(--ink-muted); }
  .foot a, .leaflet-container .foot a { color: var(--pink-text); text-underline-offset: 3px; }
  .links { display: flex; gap: 16px; padding-top: 2px; }
  .links a { color: var(--ink-muted); display: inline-flex; }
  .links a:hover { color: var(--ink); }
  .links svg { width: 18px; height: 18px; fill: currentColor; }
  .links button { border: 0; padding: 0; min-height: 0; color: var(--ink-muted); display: inline-flex; }
  .links button:hover:not(:disabled) { transform: none; box-shadow: none; color: var(--ink); }
  .links button svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  /* The button shows the theme it switches to */
  #themeToggle .moon, :root[data-theme="dark"] #themeToggle .sun { display: block; }
  #themeToggle .sun, :root[data-theme="dark"] #themeToggle .moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #themeToggle .sun { display: block; }
    :root:not([data-theme="light"]) #themeToggle .moon { display: none; }
  }

  /* Leaflet in Off Hours clothes: grey map, so the stations carry the colour */
  .leaflet-container { background: var(--surface); font: 13px/1.5 var(--font-sans); }
  .leaflet-tile-pane { filter: var(--tile-filter); opacity: var(--tile-opacity); }
  .leaflet-touch .leaflet-bar { border: 1px solid var(--line-strong); border-radius: var(--radius-md); overflow: hidden; }
  .leaflet-bar a, .leaflet-touch .leaflet-bar a { background: var(--surface-raised); color: var(--ink); border-bottom-color: var(--line); }
  .leaflet-bar a:hover { background: var(--surface-sunken); }
  .leaflet-bar a.leaflet-disabled { background: var(--surface-raised); color: var(--line-strong); }
  .leaflet-container .leaflet-control-attribution { background: var(--surface); color: var(--ink-muted); font-size: 11px; }
  .leaflet-control-attribution a { color: var(--pink-text); }
  .leaflet-tooltip {
    background: var(--surface-raised); color: var(--ink); border: 1px solid var(--line);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-soft); font: 500 12px/1.4 var(--font-sans);
  }
  .leaflet-tooltip-top:before { border-top-color: var(--surface-raised); }
  .leaflet-tooltip-bottom:before { border-bottom-color: var(--surface-raised); }
  .leaflet-tooltip-left:before { border-left-color: var(--surface-raised); }
  .leaflet-tooltip-right:before { border-right-color: var(--surface-raised); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface-raised); color: var(--ink); box-shadow: var(--shadow-soft); }
  .leaflet-popup-content-wrapper { border: 1px solid var(--line); border-radius: var(--radius-md); }
  .leaflet-popup-content { margin: 14px 18px 14px 16px; font: 13px/1.45 var(--font-sans); }
  .leaflet-container a.leaflet-popup-close-button { color: var(--ink-muted); }
  .ev h4 { margin: 6px 0 2px; font: 700 16px/1.3 var(--font-display); letter-spacing: -0.01em; }
  .ev .when { color: var(--ink-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ev ul { margin: 8px 0 0; padding-left: 18px; }
  .ev p { margin: 8px 0 0; }
  .ev .foot { margin-top: 10px; padding-top: 8px; }

  /* Large screens: a dashboard that fits the window, so every chart is in view without scrolling */
  @media (min-width: 1100px) and (min-height: 600px) {
    body { grid-template-columns: minmax(320px, 1fr) 2fr; }
    #panel { padding: 0 28px 12px; }
    .head { margin: 0 -28px; padding: 14px 28px 12px; align-items: center; }
    .brand { flex: none; }
    .brand h1 { font-size: 30px; margin: 2px 0 0; }
    .modes { margin-top: 6px; }
    .find { order: 0; flex: 1; position: relative; max-width: 360px; margin-left: auto; }
    #search { margin: 0; }
    #results {
      position: absolute; z-index: 1001; left: 0; right: 0; top: 46px; margin: 0; padding: 4px;
      background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md);
      box-shadow: var(--shadow-soft);
    }
    #results:empty { display: none; }
    #detail { flex: 1 0 auto; display: flex; flex-direction: column; }
    .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
    .top h2 { margin-top: 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .controls .seg { margin-top: 0; }
    .controls .seg button { white-space: nowrap; }
    .tiles { margin-top: 14px; }
    .tiles:has(.split-tile) { grid-template-columns: 1fr 1fr 1fr 2fr; }
    .split-tile { grid-column: auto; }
    .tile { padding: 10px 14px; }
    .dash { flex: 1 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }
    .dash:not(:has(#fd)) { grid-template-columns: 1fr; }
    .col { display: flex; flex-direction: column; min-width: 0; }
    .col h3 { margin-top: 18px; }
    .col .seg { margin-top: 8px; }
    /* The charts fill what the layout gives them, with a minimum below which the panel scrolls.
       Their contents are taken out of the flow so a redraw never feeds back into that size. */
    .col .chart { flex: 1 1 0; min-height: 110px; }
    .col .chart > svg, .col .chart > canvas { position: absolute; top: 0; left: 0; }
    .col .chart > .sub { position: absolute; bottom: 0; left: 0; }
    .lanes { margin-top: 10px; }
    .foot { margin-top: 10px; padding-top: 8px; }
  }
  /* Shorter windows: tighter spacing and no chart descriptions, so the charts keep their height */
  @media (min-width: 1100px) and (min-height: 600px) and (max-height: 860px) {
    .head { padding: 10px 28px 8px; }
    .head .label { display: none; }
    .brand h1 { font-size: 26px; }
    .top h2 { font: 700 24px/30px var(--font-display); margin-top: 10px; }
    .tiles { margin-top: 10px; }
    .tile { padding: 6px 12px; }
    .tile .v { font-size: 20px; line-height: 26px; }
    .tile .l { margin-top: 2px; }
    .split-tile .legend { margin-top: 2px; }
    .col h3 { margin-top: 12px; }
    .col > .sub { display: none; }
    .lanes { margin-top: 6px; }
  }

  @media (max-width: 800px) {
    body { grid-template-columns: 100%; grid-template-rows: 50vh auto; height: auto; }
    #map { height: 50vh; }
    #panel { border-left: 0; border-top: 1px solid var(--line); padding: 0 16px 24px; overflow: visible; }
    .head { margin: 0 -16px 8px; padding: 24px 16px 20px; }
    h1 { font-size: 36px; }
  }
</style>
</head>

<aside id="panel">

      <div class="label">Traffic counters · Finland</div>

      <input id="search" type="search" placeholder="Search counter by name or number" autocomplete="off" aria-label="Search stations">
      <ul id="results"></ul>

    <div class="links">
      <button type="button" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
    </div>
  </header>
  <div id="detail"><p class="muted">Click a counter on the map to see its traffic for the last 30 or 365 days: Fintraffic's LAM stations across Finland, and the City of Helsinki's own car, bicycle and pedestrian counters.</p></div>
</aside>
<div id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";

const API = "https://tie.digitraffic.fi/api/tms/v1";
// The City of Helsinki's own counters (scripts/ingest-hel.mjs); its API is linked for CSV downloads.
const HEL_API = "https://lidotiku.api.hel.fi/api";
// What a station counts. Digitraffic's LAM stations count motor vehicles.
const MODES = {
  car: { label: "Motor vehicles", unit: "vehicles", noun: "traffic counter", color: "--station" },
  bike: { label: "Cyclists", unit: "cyclists", noun: "cycle counter", color: "--station-bike" },
  pedestrian: { label: "Pedestrians", unit: "pedestrians", noun: "pedestrian counter", color: "--station-walk" },
};
// Public URL of the R2 bucket filled by .github/workflows/ingest.yml. "?data=<url>" points the
// page at another copy, e.g. data/ from the ingest scripts: run `python3 -m http.server` in the
// repository and open http://localhost:8000/?data=data
const DATA = new URLSearchParams(location.search).get("data") ?? "https://pub-7ef605d5211f4ee0aca2e94617311d5a.r2.dev";
// 5-minute per-lane files from scripts/ingest-fd.mjs.
const FD = `${DATA}/fd`;
const FD_DAYS = 7;
const RANGES = [30, 365];
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmt = new Intl.NumberFormat("en-US");

// ---------- dates (Finnish local date, since the reports use Finnish days) ----------
function helsinkiToday() {
  // en-CA formats as YYYY-MM-DD
  const s = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Helsinki" }).format(new Date());
  const [y, m, d] = s.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function addDays(date, n) { return new Date(date.getTime() + n * 86400000); }
function iso(date) { return date.toISOString().slice(0, 10); }
function key(date) { return iso(date).replace(/-/g, ""); }
function fromKey(k) { return new Date(Date.UTC(+k.slice(0, 4), +k.slice(4, 6) - 1, +k.slice(6, 8))); }

// The selected window ends at the newest day in the data (from meta.json), or yesterday
// if that can't be loaded. "days" is the selected window length, kept when switching station.
let END = addDays(helsinkiToday(), -1);
let updated = null;
let days = RANGES[0];
function windowDates() {
  const start = addDays(END, -(days - 1));
  return Array.from({ length: days }, (_, i) => addDays(start, i));
}

async function loadMeta() {
  try {
    const res = await fetch(`${DATA}/meta.json`);
    if (!res.ok) return;
    const meta = await res.json();
    END = fromKey(meta.end);
    updated = new Date(meta.updated);
  } catch (e) { /* keep defaults */ }
}

// ---------- map ----------
const map = L.map("map", { preferCanvas: true }).setView([64.5, 26], 5);
// OSM's tile usage policy requires a valid Referer header; tiles requested
// without one are served as an "access blocked" image.
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  referrerPolicy: "strict-origin-when-cross-origin",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Data: Fintraffic / <a href="https://www.digitraffic.fi/">Digitraffic</a>, <a href="https://lidotiku.api.hel.fi/api/">City of Helsinki</a>, CC BY 4.0',
}).addTo(map);

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let stations = [];
let selectedMarker = null;

function markerStyle(st, selected) {
  return {
    radius: selected ? 8 : 5,
    weight: selected ? 2 : 1,
    color: css("--surface"),
    fillColor: selected ? css("--station-sel") : st.inactive ? css("--station-off") : css(MODES[st.mode].color),
    fillOpacity: 0.95,
  };
}

// ---------- theme ----------
// The markers and the canvas chart read their colours when drawn, so a theme change restyles them.
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme ?? (darkQuery.matches ? "dark" : "light")) === "dark";
function themeChanged() {
  document.getElementById("themeToggle").setAttribute("aria-pressed", String(isDark()));
  for (const st of stations) st.marker?.setStyle(markerStyle(st, st.marker === selectedMarker));
  if (fdState?.dirs) drawFd();
  for (const ev of Object.values(EVENTS)) ev.layer?.eachLayer((l) => l.setStyle(eventStyle(ev, l)));
}
document.getElementById("themeToggle").addEventListener("click", () => {
  const theme = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("theme", theme); } catch (e) { /* not saved */ }
  themeChanged();
});
darkQuery.addEventListener("change", themeChanged);
document.getElementById("themeToggle").setAttribute("aria-pressed", String(isDark()));

function prettyName(name) { return name.replace(/_/g, " "); }
// "Station 149 · Name" for LAM stations; Helsinki counters are named by the city, sometimes with a
// sequence number or feed name in front ("4_Aleksanterinkatu", "Formula : Lauttasaaren silta etelä").
function displayName(st) { return st.kind === "hel" ? prettyName(st.name.replace(/^([\d.]+_|Formula : )/, "")) : prettyName(st.name); }
function stationLabel(st) { return st.kind === "hel" ? `${displayName(st)} · Helsinki` : `${st.tms} · ${displayName(st)}`; }

// Helsinki counters that stopped reporting more than this many days before the newest data are grey.
const HEL_STALE_DAYS = 7;

async function loadHelStations() {
  try {
    const res = await fetch(`${DATA}/hel/stations.json`);
    if (!res.ok) return [];
    return (await res.json()).map((s) => ({
      kind: "hel",
      key: `hel-${s.id}`,
      id: s.id,
      name: s.name,
      source: s.source,
      mode: s.mode,
      dirs: s.dirs,
      last: s.last,
      lat: s.lat,
      lon: s.lon,
    }));
  } catch (e) { return []; } // the LAM stations still work without them
}

const shownModes = new Set(Object.keys(MODES));

function renderModes() {
  const el = document.getElementById("modes");
  el.innerHTML = Object.entries(MODES).map(([k, m]) => {
    const n = stations.filter((s) => s.mode === k).length;
    return n ? `<button data-mode="${k}" aria-pressed="${shownModes.has(k)}"><i style="background:var(${m.color})"></i>${m.label} ${n}</button>` : "";
  }).join("");
  el.querySelectorAll("[data-mode]").forEach((b) => {
    b.onclick = () => {
      const k = b.dataset.mode;
      if (shownModes.has(k)) shownModes.delete(k); else shownModes.add(k);
      for (const st of stations) {
        if (st.mode !== k) continue;
        // The selected station stays on the map.
        if (shownModes.has(k) || st.marker === selectedMarker) st.marker.addTo(map); else st.marker.remove();
      }
      renderModes();
    };
  });
}

async function loadStations() {
  try {
    const [res, hel] = await Promise.all([fetch(`${API}/stations`, { headers: { "Digitraffic-User": "lammap" } }), loadHelStations(), loadMeta()]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const gj = await res.json();
    const lam = gj.features.map((f) => ({
      kind: "lam",
      key: String(f.properties.tmsNumber),
      id: f.id,
      tms: f.properties.tmsNumber, // the history API is keyed by tmsNumber, NOT by feature id
      name: f.properties.name,
      mode: "car",
      inactive: f.properties.collectionStatus !== "GATHERING",
      lat: f.geometry.coordinates[1],
      lon: f.geometry.coordinates[0],
    }));
    const stale = key(addDays(END, -HEL_STALE_DAYS));
    for (const st of hel) st.inactive = st.last < stale;
    stations = [...lam, ...hel];
    for (const st of stations) {
      st.marker = L.circleMarker([st.lat, st.lon], markerStyle(st, false))
        .bindTooltip(escapeHtml(stationLabel(st)))
        .on("click", () => selectStation(st))
        .addTo(map);
    }
    const active = lam.filter((s) => !s.inactive).length;
    document.getElementById("stationCount").textContent =
      `${lam.length} LAM stations (${active} active, ${lam.length - active} temporarily removed, grey)` +
      (hel.length ? ` and ${hel.length} City of Helsinki counters` : "");
    renderModes();
    const fromHash = decodeURIComponent(location.hash.slice(1));
    const initial = stations.find((s) => s.key === fromHash);
    if (initial) { selectStation(initial); map.setView([initial.lat, initial.lon], initial.kind === "hel" ? 13 : 10); }
  } catch (e) {
    document.getElementById("stationCount").innerHTML =
      `<span class="error">Could not load stations (${e.message}).</span> <button onclick="location.reload()">Retry</button>`;
  }
}

// ---------- disruptions and roadworks ----------
// Digitraffic's traffic messages that are valid right now, drawn under the counters. The roadworks
// are about 1 MB, so they load only when switched on; both refresh while they are shown.
const TM_API = "https://tie.digitraffic.fi/api/traffic-message/v2";
const EVENTS = {
  disruption: { label: "Disruptions", path: "traffic-announcements", color: "--disruption", on: true },
  roadwork: { label: "Roadworks", path: "roadworks", color: "--roadwork", on: false },
};
const EVENTS_REFRESH_MS = 5 * 60_000;
const ANNOUNCEMENT_TYPES = {
  general: "Traffic announcement",
  "accident report": "Accident",
  "preliminary accident report": "Accident, preliminary",
  "unconfirmed observation": "Unconfirmed observation",
  "ended": "Ended",
  "retracted": "Retracted",
};
// The messages are in Finnish; the common restrictions get an English name, the rest stay as sent.
const FEATURES_EN = {
  "Nopeusrajoitus": "Speed limit",
  "Ajokaista suljettu liikenteeltä": "Lane closed",
  "Ajokaistoja suljettu liikenteeltä": "Lanes closed",
  "Ajokaistoja on kavennettu": "Narrowed lanes",
  "Toinen ajorata on suljettu liikenteeltä": "One carriageway closed",
  "Tie on suljettu liikenteeltä": "Road closed",
  "Liikenne pysäytetään ajoittain": "Traffic stopped at times",
  "Liikenne ohjataan vuorotellen tapahtumapaikan ohi": "Alternating one-way traffic",
  "Liikenne ohjataan kaksisuuntaisena toiselle ajoradalle": "Two-way traffic on one carriageway",
  "Paikalla tilapäinen liikennevalo-ohjaus": "Temporary traffic lights",
  "Tapahtumapaikalla on käytössä kiertotie": "Detour in use",
  "Paikalla on kiertotieopastus": "Detour signposted",
  "Kiertotien kuvaus": "Detour",
  "Ajoneuvon suurin sallittu leveys": "Max vehicle width",
  "Ajoneuvon suurin sallittu korkeus": "Max vehicle height",
  "Ajoneuvon suurin sallittu pituus": "Max vehicle length",
  "Ajoneuvon suurin sallittu massa": "Max vehicle weight",
  "Liikennejärjestelyt ovat muuttuneet": "Changed traffic arrangements",
  "Lautan kantavuus on muuttunut": "Ferry load limit changed",
  "Onnettomuus": "Accident",
  "Liikenne ruuhkautuu": "Congestion",
  "Liikenne saattaa ruuhkautua": "Congestion possible",
  "Liikenne on jonoutunut": "Queues",
};

// Lines get the message colour; points are dots with a ring, so they read apart from the counters.
function eventStyle(ev, layer) {
  const point = layer instanceof L.CircleMarker;
  return {
    color: point ? css("--surface") : css(ev.color),
    weight: point ? 2 : 4,
    opacity: 0.85,
    fillColor: css(ev.color),
    fillOpacity: 0.95,
    radius: 6,
  };
}

function renderEvents() {
  const el = document.getElementById("events");
  el.innerHTML = Object.entries(EVENTS).map(([k, ev]) => {
    const n = ev.error ? "–" : ev.layer ? ev.layer.getLayers().length : ev.on ? "…" : "";
    const title = ev.error ? ` title="Could not load (${escapeHtml(ev.error)})"` : "";
    return `<button data-event="${k}" aria-pressed="${ev.on}"${title}><i class="line" style="background:var(${ev.color})"></i>${ev.label} ${n}</button>`;
  }).join("");
  el.querySelectorAll("[data-event]").forEach((b) => {
    b.onclick = () => {
      const ev = EVENTS[b.dataset.event];
      ev.on = !ev.on;
      if (!ev.on) ev.layer?.remove();
      else if (!ev.layer || Date.now() - ev.loaded > EVENTS_REFRESH_MS) loadEvents(b.dataset.event);
      if (ev.on && ev.layer) showEvents(ev);
      renderEvents();
    };
  });
}

function showEvents(ev) {
  ev.layer.addTo(map);
  // Under the counters, so a counter on a road with roadworks can still be clicked.
  ev.layer.eachLayer((l) => l.bringToBack());
}

async function loadEvents(k) {
  const ev = EVENTS[k];
  const now = encodeURIComponent(new Date().toISOString());
  try {
    const res = await fetch(`${TM_API}/${ev.path}?from=${now}&to=${now}`, { headers: { "Digitraffic-User": "lammap" } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const features = (await res.json()).features.filter((f) => f.geometry && f.properties.announcements?.length);
    ev.layer?.remove();
    ev.layer = L.geoJSON(features, {
      pointToLayer: (f, latlng) => L.circleMarker(latlng),
      onEachFeature: (f, layer) => {
        layer.setStyle(eventStyle(ev, layer));
        layer.bindTooltip(escapeHtml(eventHeading(f.properties)), { sticky: true });
        layer.bindPopup(() => eventPopup(ev, f.properties), { maxWidth: 320 });
      },
    });
    ev.loaded = Date.now();
    ev.error = null;
    if (ev.on) showEvents(ev);
  } catch (e) {
    ev.error = e.message;
  }
  renderEvents();
}

setInterval(() => {
  if (document.hidden) return;
  for (const [k, ev] of Object.entries(EVENTS)) if (ev.on) loadEvents(k);
}, EVENTS_REFRESH_MS);

// "Aitoniemen tie, road 14193 · Tampere", from the road address, or the start of the Finnish title.
function eventHeading(p) {
  const a = p.announcements[0];
  const pt = a.locationDetails?.roadAddressLocation?.primaryPoint;
  const road = pt?.roadAddress?.road;
  const name = [pt?.roadName, road && (pt.roadName ? `road ${road}` : `Road ${road}`)].filter(Boolean).join(", ");
  return name ? [name, pt.municipality].filter(Boolean).join(" · ") : a.title.split(". ")[0];
}

const timeFmt = new Intl.DateTimeFormat("en-GB", {
  timeZone: "Europe/Helsinki", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
});
function fmtTime(s) {
  const p = Object.fromEntries(timeFmt.formatToParts(new Date(s)).map((x) => [x.type, x.value]));
  const year = p.year === String(helsinkiToday().getUTCFullYear()) ? "" : p.year;
  return `${+p.day}.${+p.month}.${year} ${p.hour}:${p.minute}`;
}
function eventWhen(t) {
  if (!t?.startTime) return "";
  return t.endTime ? `${fmtTime(t.startTime)} – ${fmtTime(t.endTime)}` : `Since ${fmtTime(t.startTime)}`;
}

function featureText(f) {
  const name = FEATURES_EN[f.name] ?? f.name;
  if (f.quantity != null) return `${name} ${fmt.format(f.quantity)} ${f.unit ?? ""}`.trim();
  return f.description ? `${name}: ${f.description}` : name;
}

function eventPopup(ev, p) {
  const a = p.announcements[0];
  const type = p.situationType === "road work" ? "Roadwork" : ANNOUNCEMENT_TYPES[p.trafficAnnouncementType] ?? "Traffic announcement";
  const features = [...new Set(a.features.map(featureText))];
  const works = [...new Set(a.roadWorkPhases.flatMap((ph) => ph.workTypes ?? []).map((w) => w.type).filter((t) => t && t !== "other"))];
  const where = escapeHtml(a.location?.description ?? "").replace(/\n/g, "<br>");
  return `<div class="ev">
    <div class="label" style="color:var(${ev.color})">${type}</div>
    <h4>${escapeHtml(eventHeading(p))}</h4>
    <div class="when">${escapeHtml(eventWhen(a.timeAndDuration))}</div>
    ${features.length ? `<ul>${features.map((f) => `<li>${escapeHtml(f)}</li>`).join("")}</ul>` : ""}
    ${works.length ? `<p>Work: ${escapeHtml(works.join(", "))}</p>` : ""}
    ${where ? `<p class="muted" lang="fi">${where}</p>` : ""}
    <div class="foot">${escapeHtml(a.sender ?? "Fintraffic")} · <a href="https://liikennetilanne.fintraffic.fi/" target="_blank" rel="noopener">Fintraffic traffic situation</a></div>
  </div>`;
}

// ---------- search ----------
const searchEl = document.getElementById("search");
const resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = "";
  if (!q) return;
  const hits = stations
    .filter((s) => String(s.tms ?? s.id) === q || displayName(s).toLowerCase().includes(q) || s.name.toLowerCase().includes(q))
    .slice(0, 30);
  for (const s of hits) {
    const li = document.createElement("li");
    li.textContent = stationLabel(s);
    li.onclick = () => {
      map.setView([s.lat, s.lon], s.kind === "hel" ? 13 : 11);
      selectStation(s);
      searchEl.value = "";
      resultsEl.innerHTML = "";
    };
    resultsEl.appendChild(li);
  }
  if (!hits.length) resultsEl.innerHTML = '<li class="muted">No matches</li>';
});

// ---------- data ----------
const cache = new Map();

// Link to the original CSV for the selected window: Digitraffic's report, or the hourly (daily for
// long windows, which would pass the API's page limit) sums from the City of Helsinki's API.
function historyUrl(st) {
  if (st.kind === "hel") {
    const p = new URLSearchParams({
      counter: String(st.id),
      period: days > 31 ? "day" : "hour",
      measurement_type: "count",
      start_date: iso(windowDates()[0]),
      end_date: iso(END),
      order: "start_time",
      page_size: "10000",
      format: "csv",
    });
    return `${HEL_API}/observations/aggregate/?${p}`;
  }
  const tms = st.tms;
  const p = new URLSearchParams({
    api: "liikennemaara", // corrected traffic volumes
    tyyppi: "h",          // hourly report
    pvm: iso(windowDates()[0]),
    loppu: iso(END),
    lam_type: "option1",
    piste: String(tms),
  });
  // Without "suunta" the report sums both directions into one row ("*").
  p.append("suunta", "1");
  p.append("suunta", "2");
  return `${API}/history?${p}`;
}

// Station files hold { all, d1, d2 }, each mapping YYYYMMDD -> [h00..h23, total] (see scripts/ingest.mjs).
// Returns { all, d1, d2, hasDirections }, each a Map(YYYYMMDD -> { hours: number[24], total: number }).
function toReport(json) {
  const toMap = (o = {}) => new Map(Object.entries(o).map(([k, v]) => [k, { hours: v.slice(0, 24), total: v[24] }]));
  const maps = { all: toMap(json.all), d1: toMap(json.d1), d2: toMap(json.d2) };
  // One-way stations only report one direction: count the other as zero.
  for (const [have, fill] of [["d1", "d2"], ["d2", "d1"]]) {
    if (!maps[fill].size) for (const k of maps[have].keys()) maps[fill].set(k, { hours: Array(24).fill(0), total: 0 });
  }
  const hasDirections = maps.d1.size > 0 && maps.d2.size > 0;
  // No combined rows: build "both directions" as the sum of the two.
  if (!maps.all.size && hasDirections) {
    for (const [k, v] of maps.d1) {
      const w = maps.d2.get(k);
      if (w) maps.all.set(k, { hours: v.hours.map((x, i) => x + w.hours[i]), total: v.total + w.total });
    }
  }
  return { ...maps, hasDirections };
}

// Direction names ("towards Helsinki") from the station metadata. Best effort.
const dirNameCache = new Map();
async function fetchDirectionNames(st) {
  if (st.kind === "hel") return st.dirs ?? ["Direction 1", "Direction 2"];
  if (dirNameCache.has(st.id)) return dirNameCache.get(st.id);
  let names = ["Direction 1", "Direction 2"];
  try {
    const res = await fetch(`${API}/stations/${st.id}`, { headers: { "Digitraffic-User": "lammap" } });
    if (res.ok) {
      const p = (await res.json()).properties || {};
      names = [p.direction1Municipality, p.direction2Municipality]
        .map((m, i) => (m ? `Towards ${m}` : names[i]));
    }
  } catch (e) { /* keep defaults */ }
  dirNameCache.set(st.id, names);
  return names;
}

async function fetchReport(st) {
  if (cache.has(st.key)) return cache.get(st.key);
  const res = await fetch(st.kind === "hel" ? `${DATA}/hel/${st.id}.json` : `${DATA}/stations/${st.tms}.json`);
  if (!res.ok && res.status !== 404) throw new Error(`HTTP ${res.status}`);
  const report = toReport(res.ok ? await res.json() : {}); // 404: station not ingested yet
  cache.set(st.key, report);
  return report;
}

function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : NaN; }

function analyse(days, dates) {
  const daily = dates.map((d) => {
    const rec = days.get(key(d));
    return { date: d, dow: d.getUTCDay(), total: rec ? rec.total : null, hours: rec ? rec.hours : null };
  });
  const present = daily.filter((d) => d.total !== null);
  const weekday = present.filter((d) => d.dow >= 1 && d.dow <= 5);
  const weekend = present.filter((d) => d.dow === 0 || d.dow === 6);
  const hourly = Array.from({ length: 24 }, (_, h) => mean(present.map((d) => d.hours[h])));
  const hourlySum = hourly.reduce((a, b) => a + b, 0);
  return {
    daily,
    nDays: present.length,
    adt: mean(present.map((d) => d.total)),
    adtWeekday: mean(weekday.map((d) => d.total)),
    adtWeekend: mean(weekend.map((d) => d.total)),
    hourly,
    hourlyShare: hourly.map((v) => (hourlySum ? (v / hourlySum) * 100 : 0)),
  };
}

// ---------- UI ----------
let requestSeq = 0;

function headHtml(st) {
  const what = st.kind === "hel"
    ? `City of Helsinki ${MODES[st.mode].noun} · ${escapeHtml(st.source)}` +
      (st.inactive ? ` · no data since ${fmtDate(fromKey(st.last))}` : "")
    : `Station ${st.tms}${st.inactive ? " · temporarily removed" : ""}`;
  return `
    <h2>${escapeHtml(displayName(st))}</h2>
    <div class="sub">${what} · ${fmtDate(windowDates()[0])} – ${fmtDate(END)}</div>`;
}

async function selectStation(st) {
  if (selectedMarker) {
    const prev = selectedMarker.station;
    selectedMarker.setStyle(markerStyle(prev, false));
    if (!shownModes.has(prev.mode) && prev !== st) selectedMarker.remove();
  }
  st.marker.station = st;
  if (!st.marker._map) st.marker.addTo(map); // found by search or link while its mode was hidden
  st.marker.setStyle(markerStyle(st, true)).bringToFront();
  selectedMarker = st.marker;
  history.replaceState(null, "", `#${st.key}`);

  const seq = ++requestSeq;
  const detail = document.getElementById("detail");
  detail.innerHTML = headHtml(st) + '<p class="muted">Loading traffic data…</p>';

  try {
    const [report, dirNames] = await Promise.all([fetchReport(st), fetchDirectionNames(st)]);
    if (seq !== requestSeq) return; // a newer click won
    if (!report.hasDirections) selectedDir = "all";
    renderDetail(st, report, dirNames);
  } catch (e) {
    if (seq !== requestSeq) return;
    detail.innerHTML = headHtml(st) + `<p class="error">Could not load data (${escapeHtml(e.message)}).</p>`;
    const btn = document.createElement("button");
    btn.textContent = "Retry";
    btn.onclick = () => selectStation(st);
    detail.appendChild(btn);
  }
}

// "all" = both directions, "d1"/"d2" = one direction. Kept when switching station.
let selectedDir = "all";

function renderDetail(st, report, dirNames) {
  const detail = document.getElementById("detail");
  const dates = windowDates();
  const hasDirections = report.hasDirections;
  const view = {
    all: analyse(report.all, dates),
    d1: hasDirections ? analyse(report.d1, dates) : null,
    d2: hasDirections ? analyse(report.d2, dates) : null,
  };
  const rangeSeg = `
    <div class="seg" role="group" aria-label="Period">
      ${RANGES.map((n) => `<button data-days="${n}" aria-pressed="${days === n}">Last ${n} days</button>`).join("")}
    </div>`;
  const wireRange = () => detail.querySelectorAll("[data-days]").forEach((b) => {
    b.onclick = () => { days = Number(b.dataset.days); renderDetail(st, report, dirNames); };
  });
  if (!view.all.nDays) {
    current = null;
    detail.innerHTML = headHtml(st) + rangeSeg +
      `<p class="muted">No traffic data published for this station in the last ${days} days.</p>`;
    wireRange();
    return;
  }

  const a = view[selectedDir];
  const unit = MODES[st.mode].unit;
  const Unit = unit.replace(/^\w/, (c) => c.toUpperCase());
  const dirLabel = selectedDir === "all" ? "both directions" : dirNames[selectedDir === "d1" ? 0 : 1].replace(/^\w/, (c) => c.toLowerCase());
  // Eco-Counter devices and the city's bicycle loop never split by direction, so they get no direction buttons.
  const noDirections = st.kind === "hel" && !st.dirs;
  const btn = (k, label) =>
    `<button data-dir="${k}" aria-pressed="${selectedDir === k}" ${hasDirections || k === "all" ? "" : "disabled"}>${escapeHtml(label)}</button>`;
  let split = "";
  if (hasDirections && selectedDir === "all") {
    const t1 = view.d1.adt, t2 = view.d2.adt;
    const p1 = t1 + t2 ? (t1 / (t1 + t2)) * 100 : 50;
    split = `
      <div class="tile split-tile">
      <div class="l">Direction split</div>
      <div class="split">
        <div style="width:${p1}%;background:var(--dir-1)"></div>
        <div style="width:${100 - p1}%;background:var(--dir-2)"></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--dir-1)"></i>${escapeHtml(dirNames[0])}: ${fmtInt(t1)}/day (${p1.toFixed(0)}%)</span>
        <span><i style="background:var(--dir-2)"></i>${escapeHtml(dirNames[1])}: ${fmtInt(t2)}/day (${(100 - p1).toFixed(0)}%)</span>
      </div>
      </div>`;
  }
  const stacked = hasDirections && selectedDir === "all";
  const weekly = days > 31;
  const missing = weekly ? weeks(a.daily).some((w) => w.every((d) => d.total === null)) : a.nDays < days;
  detail.innerHTML = `
    <div class="top">
      <div>${headHtml(st)}</div>
      <div class="controls">
        ${rangeSeg}
        ${noDirections ? "" : `<div class="seg" role="group" aria-label="Direction">
          ${btn("all", "Both directions")}${btn("d1", dirNames[0])}${btn("d2", dirNames[1])}
        </div>`}
      </div>
    </div>
    ${hasDirections || noDirections ? "" : '<div class="sub" style="margin-top:4px">This report has no per-direction breakdown for this station.</div>'}
    <div class="tiles">
      <div class="tile"><div class="v">${fmtInt(a.adt)}</div><div class="l">${st.mode === "car" ? "Avg. daily traffic" : `Avg. daily ${unit}`}</div></div>
      <div class="tile"><div class="v">${fmtInt(a.adtWeekday)}</div><div class="l">Weekday avg. (Mon–Fri)</div></div>
      <div class="tile"><div class="v">${fmtInt(a.adtWeekend)}</div><div class="l">Weekend avg. (Sat–Sun)</div></div>
      ${split}
    </div>
    <div class="sub" style="margin-top:6px">${Unit} per day${noDirections ? "" : `, ${escapeHtml(dirLabel)}`}${st.mode === "car" ? ", all vehicle classes" : ""}.
      Based on ${a.nDays} of ${days} days with data.</div>

    <div class="dash">
    <div class="col">
    <h3>Average hourly distribution</h3>
    <div class="sub">Average ${unit} per hour of day (Finnish time)</div>
    ${stacked ? `<div class="legend">
      <span><i style="background:var(--dir-1)"></i>${escapeHtml(dirNames[0])}</span>
      <span><i style="background:var(--dir-2)"></i>${escapeHtml(dirNames[1])}</span>
    </div>` : ""}
    <div class="chart" id="hourChart"></div>

    ${weekly ? `<h3>Weekly traffic, last ${days} days</h3>
    <div class="sub">Average ${unit} per day in each week (Mon–Sun)</div>` : `<h3>Daily traffic, last ${days} days</h3>`}
    <div class="legend">
      ${weekly ? "" : `<span><i style="background:var(--series-1)"></i>Weekday</span>
      <span><i style="background:var(--series-2)"></i>Weekend</span>`}
      ${missing ? '<span><i style="background:var(--missing)"></i>No data</span>' : ""}
    </div>
    <div class="chart" id="dayChart"></div>
    </div>
    ${st.kind === "lam" ? '<div class="col" id="fd"><h3>Fundamental diagram</h3><p class="muted">Loading lane data…</p></div>' : ""}
    </div>

    <div class="foot">
      ${st.kind === "hel"
        ? `Source: City of Helsinki, <a href="${HEL_API}/">LIDO-TIKU API</a> (${escapeHtml(st.source)}), CC BY 4.0. Hourly sums, uncorrected; days cut short by an outage are left out. Updated daily${updated ? `, last on ${fmtDate(updated)}` : ""}.`
        : `Source: Digitraffic LAM “liikennemäärä” hourly report (checked/corrected volumes), updated daily${updated ? `, last on ${fmtDate(updated)}` : ""}.`}
      <a href="${historyUrl(st)}">Download CSV</a>
    </div>`;
  detail.querySelectorAll("[data-dir]").forEach((b) => {
    b.onclick = () => {
      selectedDir = b.dataset.dir;
      renderDetail(st, report, dirNames);
    };
  });
  wireRange();
  drawCharts({ a, view, dirNames, stacked, weekly, unit });
  if (st.kind === "lam") showFd(st, dirNames);
  else { stopLive(); fdState = null; }
}

// Splits days into Monday-to-Sunday weeks; the first and last week may be partial.
function weeks(daily) {
  const out = [];
  for (const d of daily) {
    if (!out.length || d.dow === 1) out.push([]);
    out[out.length - 1].push(d);
  }
  return out;
}

let current = null;
function drawCharts(state) {
  current = state;
  const { a, view, dirNames, stacked, weekly, unit } = state;
  const hourEl = document.getElementById("hourChart");
  const dayEl = document.getElementById("dayChart");
  if (!hourEl || !dayEl) return;
  const dirColor = selectedDir === "all" ? "var(--series-1)" : `var(--dir-${selectedDir.slice(1)})`;
  barChart(hourEl, a.hourly.map((v, h) => {
    const range = `${String(h).padStart(2, "0")}:00–${String(h + 1).padStart(2, "0")}:00`;
    const bar = {
      label: String(h).padStart(2, "0"),
      showLabel: h % 3 === 0,
      value: v,
      color: dirColor,
      tip: `<div>${range}</div><b>${fmtInt(v)}</b> ${unit}/h · ${a.hourlyShare[h].toFixed(1)}% of day`,
    };
    if (stacked) {
      const v1 = view.d1.hourly[h], v2 = view.d2.hourly[h];
      bar.segments = [{ value: v1 || 0, color: "var(--dir-1)" }, { value: v2 || 0, color: "var(--dir-2)" }];
      bar.value = (v1 || 0) + (v2 || 0);
      bar.tip = `<div>${range}</div><b>${fmtInt(bar.value)}</b> ${unit}/h` +
        `<div>${escapeHtml(dirNames[0])}: <b>${fmtInt(v1)}</b></div>` +
        `<div>${escapeHtml(dirNames[1])}: <b>${fmtInt(v2)}</b></div>`;
    }
    return bar;
  }));
  if (weekly) {
    barChart(dayEl, weeks(a.daily).map((w) => {
      const present = w.filter((d) => d.total !== null);
      const v = present.length ? mean(present.map((d) => d.total)) : null;
      const monthStart = w.find((d) => d.date.getUTCDate() === 1);
      return {
        label: monthStart ? MONTHS[monthStart.date.getUTCMonth()] : "",
        showLabel: !!monthStart,
        value: v,
        color: dirColor,
        tip: `<div>${fmtDate(w[0].date)} – ${fmtDate(w[w.length - 1].date)}</div>` +
          (v === null ? '<span class="muted">No data</span>' : `<b>${fmtInt(v)}</b> ${unit}/day`) +
          (present.length && present.length < w.length ? ` <span class="muted">(${present.length} of ${w.length} days)</span>` : ""),
      };
    }));
    return;
  }
  barChart(dayEl, a.daily.map((d, i) => {
    const weekend = d.dow === 0 || d.dow === 6;
    return {
      label: `${d.date.getUTCDate()}.${d.date.getUTCMonth() + 1}.`,
      showLabel: i % 5 === 0 || i === a.daily.length - 1,
      value: d.total,
      color: weekend ? "var(--series-2)" : "var(--series-1)",
      tip: `<div>${WEEKDAYS[d.dow]} ${fmtDate(d.date)}</div>` +
        (d.total === null ? '<span class="muted">No data</span>' : `<b>${fmt.format(d.total)}</b> ${unit}`),
    };
  }));
}
window.addEventListener("resize", () => {
  if (current) drawCharts(current);
  if (fdState) drawFd();
});
// The canvas axis labels use Geist Mono: redraw once the web fonts have loaded.
document.fonts?.ready.then(() => { if (fdState?.dirs) drawFd(); });

// ---------- fundamental diagram ----------
const fdCache = new Map();

// The last FD_DAYS day files of a station; days without a file are left out.
async function fetchFd(tms) {
  if (fdCache.has(tms)) return fdCache.get(tms);
  const dates = Array.from({ length: FD_DAYS }, (_, i) => addDays(END, -(FD_DAYS - 1) + i));
  const days = await Promise.all(dates.map(async (date) => {
    try {
      const res = await fetch(`${FD}/${iso(date)}/${tms}.json`);
      return res.ok ? { date, lanes: (await res.json()).lanes } : null;
    } catch (e) { return null; }
  }));
  const out = days.filter(Boolean);
  fdCache.set(tms, out);
  return out;
}

const FD_MODES = {
  qv: { label: "Flow–speed", x: "q", y: "v" },
  kq: { label: "Density–flow", x: "k", y: "q" },
  kv: { label: "Density–speed", x: "k", y: "v" },
};
const FD_AXES = {
  q: { label: "Flow (veh/h per lane)" },
  v: { label: "Speed (km/h)" },
  k: { label: "Density (veh/km per lane)" },
};
let fdMode = "qv";
let fdState = null;

// Latest real-time values of the selected station, refreshed every minute while the page is visible.
// The fixed 5-minute lane flows update every 5 minutes; speeds are rolling.
const LIVE_REFRESH_MS = 60_000;
const LIVE_MAX_AGE_MS = 30 * 60_000; // older values mean the station stopped reporting
let live = null; // { id, values: Map(sensor name -> sensor value) }
let liveTimer = null;

function startLive(id) {
  if (live?.id === id && liveTimer) return;
  stopLive();
  live = { id, values: null };
  const tick = async () => {
    try {
      const res = await fetch(`${API}/stations/${id}/data`, { headers: { "Digitraffic-User": "lammap" } });
      if (!res.ok || live?.id !== id) return;
      live.values = new Map(((await res.json()).sensorValues || []).map((v) => [v.name, v]));
      if (fdState?.id === id) drawFd();
    } catch (e) { /* keep the previous values */ }
  };
  tick();
  liveTimer = setInterval(tick, LIVE_REFRESH_MS);
}
function stopLive() {
  clearInterval(liveTimer);
  liveTimer = null;
  live = null;
}
document.addEventListener("visibilitychange", () => {
  if (!fdState?.dirs) return;
  if (document.hidden) { clearInterval(liveTimer); liveTimer = null; }
  else startLive(fdState.id);
});

// The live point of one lane: the latest fixed 5-minute lane flow, with the lane's own speed where
// the station measures it and the direction's 5-minute speed otherwise. Both are probably arithmetic
// means, so in congestion they sit a little above the harmonic speeds of the historical dots.
function livePoint(l) {
  const vals = live?.values;
  if (!vals) return null;
  const q = vals.get(`OHITUKSET_5MIN_KIINTEA_KAISTA${l.lane}`);
  const laneV = vals.get(`LIUKUVA_NOPEUS_KAISTA_${l.lane}`);
  const sv = laneV?.value > 0 ? laneV : vals.get(`KESKINOPEUS_5MIN_LIUKUVA_SUUNTA${l.dir}`);
  if (!(q?.value > 0) || !(sv?.value > 0)) return null;
  if (Date.now() - new Date(q.measuredTime) > LIVE_MAX_AGE_MS) return null;
  return { q: q.value, v: sv.value, k: q.value / sv.value, laneSpeed: sv === laneV, start: q.timeWindowStart, end: q.timeWindowEnd };
}
const clock = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Helsinki", hour: "2-digit", minute: "2-digit" });

// Builds one point per lane per 5-minute interval: flow q = n × 12 veh/h, speed v = harmonic
// mean (the space-mean speed estimate), density k = q / v.
// Lanes are numbered across the road: direction 1 from its right edge leftwards, direction 2 from
// the median outwards (inferred from heavy-vehicle shares, which are highest in the right lane).
// So within each direction, the rightmost lane comes first.
function fdLanes(days) {
  const byId = new Map();
  for (const day of days) {
    for (const l of day.lanes) {
      const id = `${l.dir}:${l.lane}`;
      if (!byId.has(id)) byId.set(id, { id, dir: l.dir, lane: l.lane, total: 0, points: [] });
      const lane = byId.get(id);
      l.n.forEach((n, i) => {
        if (!n || !l.vh[i]) return;
        const q = n * 12, v = l.vh[i] / 10;
        lane.total += n;
        lane.points.push({ q, v, k: q / v, heavy: l.heavy[i] / n, date: day.date, slot: i });
      });
    }
  }
  const dirs = { 1: [], 2: [] };
  for (const lane of byId.values()) if (dirs[lane.dir]) dirs[lane.dir].push(lane);
  for (const [d, lanes] of Object.entries(dirs)) {
    lanes.sort((a, b) => (d === "1" ? a.lane - b.lane : b.lane - a.lane));
    const total = lanes.reduce((s, l) => s + l.total, 0);
    lanes.forEach((l, i) => {
      l.color = `--lane-${Math.min(i + 1, 5)}`;
      // Lanes with hardly any traffic are usually misdetections; they start hidden.
      l.minor = l.total < total * 0.01;
    });
  }
  return dirs;
}

async function showFd(st, dirNames) {
  const el = document.getElementById("fd");
  if (!el) return;
  const seq = requestSeq;
  if (!fdState || fdState.tms !== st.tms) {
    stopLive();
    fdState = { tms: st.tms, id: st.id, hidden: null, dirs: null };
  }
  if (!fdState.dirs) {
    const days = await fetchFd(st.tms);
    if (seq !== requestSeq || !document.getElementById("fd")) return;
    if (!days.length) {
      // No lane data: the daily charts get the whole width.
      fdState = null;
      document.getElementById("fd").remove();
      if (current) drawCharts(current);
      return;
    }
    fdState.dirs = fdLanes(days);
    fdState.nDays = days.length;
    fdState.hidden = new Set(Object.values(fdState.dirs).flat().filter((l) => l.minor).map((l) => l.id));
  }
  fdState.dirNames = dirNames;
  renderFd();
  startLive(st.id);
}

function renderFd() {
  const el = document.getElementById("fd");
  const { dirs, dirNames, nDays } = fdState;
  const shown = ["1", "2"].filter((d) => dirs[d].length && (selectedDir === "all" || selectedDir === `d${d}`));
  el.innerHTML = `
    <h3>Fundamental diagram</h3>
    <div class="sub">One dot per lane per 5 minutes, last ${nDays} day${nDays === 1 ? "" : "s"}.
      Speed is the harmonic mean; density is flow ÷ speed. From Digitraffic's raw per-vehicle data.</div>
    <div class="seg" role="group" aria-label="Diagram">
      ${Object.entries(FD_MODES).map(([k, m]) => `<button data-fd="${k}" aria-pressed="${fdMode === k}">${m.label}</button>`).join("")}
    </div>
    ${shown.map((d) => `
      <div class="lanes" role="group" aria-label="${escapeHtml(dirNames[d - 1])}, lanes right to left">
        <span class="lanes-dir">${escapeHtml(dirNames[d - 1])}</span>
        ${dirs[d].map((l) => `<button data-lane="${l.id}" aria-pressed="${!fdState.hidden.has(l.id)}"
          title="${fmt.format(l.total)} vehicles"><i style="background:var(${l.color})"></i>Lane ${l.lane}</button>`).join("")}
        <span class="sub" style="align-self:center">right → left</span>
      </div>
      <div class="chart" data-fd-dir="${d}"></div>`).join("")}`;
  el.querySelectorAll("[data-fd]").forEach((b) => {
    b.onclick = () => { fdMode = b.dataset.fd; renderFd(); };
  });
  el.querySelectorAll("[data-lane]").forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.lane;
      if (fdState.hidden.has(id)) fdState.hidden.delete(id); else fdState.hidden.add(id);
      renderFd();
    };
  });
  drawFd();
}

function drawFd() {
  const charts = document.querySelectorAll("[data-fd-dir]");
  if (!charts.length) return;
  const { x, y } = FD_MODES[fdMode];
  // Shared scales, so both directions can be compared at a glance.
  const visible = (d) => fdState.dirs[d].filter((l) => !fdState.hidden.has(l.id));
  const all = [...charts].flatMap((c) => visible(c.dataset.fdDir).flatMap((l) => [...l.points, livePoint(l) ?? []].flat()));
  const top = (key) => {
    const max = Math.max(1, ...all.map((p) => p[key]));
    const step = niceStep(max / 4);
    return { max: Math.ceil(max / step) * step, step };
  };
  const sx = top(x), sy = top(y);
  charts.forEach((c) => scatter(c, visible(c.dataset.fdDir), x, y, sx, sy));
}

// On large screens the panel is a dashboard that fits the window, and the charts take the height
// the layout gives them; elsewhere they have a fixed height and the panel scrolls.
const fitQuery = matchMedia("(min-width: 1100px) and (min-height: 600px)");
const fits = () => fitQuery.matches;
const chartHeight = (el, fixed) => (fits() ? Math.max(el.clientHeight, 80) : fixed);

// Canvas scatter plot: thousands of points stay cheap, and hover finds the nearest point.
function scatter(el, lanes, xKey, yKey, sx, sy) {
  const hasLive = lanes.some((l) => livePoint(l));
  const W = Math.max(el.clientWidth, 200), H = chartHeight(el, 220) - (fits() && hasLive ? 22 : 0);
  const m = { t: 8, r: 16, b: 34, l: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const X = (v) => m.l + (v / sx.max) * iw;
  const Y = (v) => m.t + ih - (v / sy.max) * ih;
  const dpr = window.devicePixelRatio || 1;
  el.innerHTML = `<canvas width="${W * dpr}" height="${H * dpr}" style="height:${H}px" role="img"
    aria-label="${FD_AXES[yKey].label} against ${FD_AXES[xKey].label}"></canvas>`;
  const canvas = el.firstChild;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.font = `10px ${css("--font-mono")}`;
  ctx.lineWidth = 1;
  ctx.strokeStyle = css("--line");
  ctx.fillStyle = css("--ink-muted");
  ctx.textAlign = "right";
  for (let v = 0; v <= sy.max + 1e-9; v += sy.step) {
    ctx.beginPath(); ctx.moveTo(m.l, Y(v)); ctx.lineTo(W - m.r, Y(v)); ctx.stroke();
    ctx.fillText(compact(v), m.l - 6, Y(v) + 3);
  }
  ctx.textAlign = "center";
  for (let v = 0; v <= sx.max + 1e-9; v += sx.step) {
    ctx.beginPath(); ctx.moveTo(X(v), m.t); ctx.lineTo(X(v), m.t + ih); ctx.stroke();
    ctx.fillText(compact(v), X(v), m.t + ih + 13);
  }
  ctx.fillText(FD_AXES[xKey].label, m.l + iw / 2, H - 4);
  ctx.save();
  ctx.translate(10, m.t + ih / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText(FD_AXES[yKey].label, 0, 0);
  ctx.restore();

  const pts = [];
  ctx.globalAlpha = 0.55;
  for (const l of lanes) {
    ctx.fillStyle = css(l.color);
    for (const p of l.points) {
      const px = X(p[xKey]), py = Y(p[yKey]);
      ctx.beginPath(); ctx.arc(px, py, 2.2, 0, Math.PI * 2); ctx.fill();
      pts.push({ px, py, p, l });
    }
  }
  ctx.globalAlpha = 1;

  // Live points pulse on top of the canvas, as HTML elements so the canvas itself stays static.
  let liveWindow = null;
  for (const l of lanes) {
    const p = livePoint(l);
    if (!p) continue;
    liveWindow = `${clock.format(new Date(p.start))}–${clock.format(new Date(p.end))}`;
    const dot = document.createElement("div");
    dot.className = "live-dot";
    dot.style.cssText = `left:${X(p[xKey])}px;top:${Y(p[yKey])}px;background:var(${l.color})`;
    const tip = `<div>Live, ${liveWindow} · lane ${l.lane}</div>` +
      `<b>${fmtInt(p.q)}</b> veh/h · <b>${p.v.toFixed(0)}</b> km/h · <b>${p.k.toFixed(1)}</b> veh/km` +
      (p.laneSpeed ? "" : '<div class="muted">Speed: direction average (no lane speed at this station)</div>');
    dot.addEventListener("mousemove", (ev) => showTip(ev, tip));
    dot.addEventListener("mouseleave", hideTip);
    el.appendChild(dot);
  }
  if (liveWindow) {
    el.insertAdjacentHTML("beforeend", `<div class="sub"><span class="live-dot live-key" style="background:var(--ink-muted)"></span>
      Live: latest 5 minutes (${liveWindow}), updated every minute</div>`);
  }

  canvas.addEventListener("mousemove", (ev) => {
    const r = canvas.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    let best = null, bd = 100; // within 10 px
    for (const o of pts) {
      const d = (o.px - mx) ** 2 + (o.py - my) ** 2;
      if (d < bd) { bd = d; best = o; }
    }
    if (!best) return hideTip();
    const { p, l } = best;
    const t = (s) => `${String(Math.floor(s / 12)).padStart(2, "0")}:${String((s % 12) * 5).padStart(2, "0")}`;
    showTip(ev, `<div>${WEEKDAYS[p.date.getUTCDay()]} ${fmtDate(p.date)} ${t(p.slot)}–${t(p.slot + 1)} · lane ${l.lane}</div>` +
      `<b>${fmtInt(p.q)}</b> veh/h · <b>${p.v.toFixed(0)}</b> km/h · <b>${p.k.toFixed(1)}</b> veh/km` +
      `<div class="muted">${(p.heavy * 100).toFixed(0)}% heavy vehicles</div>`);
  });
  canvas.addEventListener("mouseleave", hideTip);
}

// Simple SVG bar chart with hover tooltips. value === null renders a small "no data" stub.
function barChart(el, data) {
  const W = Math.max(el.clientWidth, 200), H = chartHeight(el, 170);
  const m = { t: 8, r: 16, b: 20, l: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(1, ...data.map((d) => d.value ?? 0));
  const step = niceStep(max / 4);
  const top = Math.ceil(max / step) * step;
  const y = (v) => m.t + ih - (v / top) * ih;
  const slot = iw / data.length;
  const gap = Math.min(2, slot * 0.25);
  const bw = slot - gap;

  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  for (let v = 0; v <= top + 1e-9; v += step) {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${m.l - 6}" y="${y(v) + 3}" text-anchor="end">${compact(v)}</text>`;
  }
  data.forEach((d, i) => {
    const x = m.l + i * slot + gap / 2;
    if (d.value === null) {
      s += `<rect x="${x}" y="${y(0) - 3}" width="${bw}" height="3" fill="var(--missing)"/>`;
    } else if (d.segments) {
      let base = 0;
      const last = d.segments.map((g) => g.value > 0).lastIndexOf(true);
      d.segments.forEach((g, j) => {
        if (g.value <= 0) return;
        const yTop = y(base + g.value), h = y(base) - yTop;
        s += j === last
          ? `<path d="${topRounded(x, yTop, bw, h, Math.min(4, bw / 2))}" fill="${g.color}"/>`
          : `<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" fill="${g.color}"/>`;
        base += g.value;
      });
    } else if (d.value > 0) {
      s += `<path d="${topRounded(x, y(d.value), bw, y(0) - y(d.value), Math.min(4, bw / 2))}" fill="${d.color}"/>`;
    }
    if (d.showLabel) s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${d.label}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${m.l + i * slot}" y="${m.t}" width="${slot}" height="${ih}" fill="transparent"/>`;
  });
  s += "</svg>";
  el.innerHTML = s;

  el.querySelectorAll(".hit").forEach((r) => {
    r.addEventListener("mousemove", (ev) => showTip(ev, data[Number(r.dataset.i)].tip));
    r.addEventListener("mouseleave", hideTip);
  });
}

function topRounded(x, y, w, h, r) {
  r = Math.min(r, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

const tip = document.getElementById("tip");
function showTip(ev, html) {
  tip.innerHTML = html;
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = ev.clientX + 12, yy = ev.clientY - th - 10;
  if (x + tw > window.innerWidth - 8) x = ev.clientX - tw - 12;
  if (yy < 8) yy = ev.clientY + 14;
  tip.style.left = `${x}px`;
  tip.style.top = `${yy}px`;
}
function hideTip() { tip.style.display = "none"; }

function fmtInt(v) { return isNaN(v) ? "–" : fmt.format(Math.round(v)); }
function fmtDate(d) { return `${d.getUTCDate()}.${d.getUTCMonth() + 1}.${d.getUTCFullYear()}`; }
function compact(v) { return v >= 1000 ? `${+(v / 1000).toFixed(1)}k` : String(+v.toFixed(1)); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

loadStations();
renderEvents();
for (const k of Object.keys(EVENTS)) if (EVENTS[k].on) loadEvents(k);
</script>
</body>
