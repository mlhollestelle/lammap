name: Ingest traffic data

on:
  schedule:
    # 07:30 UTC = 09:30/10:30 Finnish time; yesterday's report is normally out by then.
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Days to (re)fetch per station (365 for a full backfill)
        default: "7"
      skip_existing:
        description: Skip stations already in the bucket (to resume a backfill)
        type: boolean
        default: false
      fd_days:
        description: Days of 5-minute lane data to keep (only missing days are fetched, older days are deleted)
        default: "7"
      nor_minutes:
        description: Minutes the Norwegian counters may take (a full year needs about 6 hours over several runs)
        default: "60"

permissions:
  contents: read
  actions: write # for the keepalive step

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # a full backfill fetches one station at a time
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Newer AWS CLI versions send checksum headers that R2 does not fully support.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: s3://${{ vars.R2_BUCKET }}
      DAYS: ${{ inputs.days || '7' }}
      SKIP_EXISTING: ${{ inputs.skip_existing && '--skip-existing' || '' }}
      FD_DAYS: ${{ inputs.fd_days || '7' }}
      NOR_MINUTES: ${{ inputs.nor_minutes || '60' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download current data from R2
        run: |
          aws s3 sync "$BUCKET/stations" data/stations --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 sync "$BUCKET/hel" data/hel --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 sync "$BUCKET/oulu" data/oulu --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 sync "$BUCKET/eco" data/eco --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 sync "$BUCKET/nor" data/nor --endpoint-url "$ENDPOINT" --only-show-errors

      - name: Fetch new days from Digitraffic
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days must be a number"; exit 1; }
          node scripts/ingest.mjs --days "$DAYS" $SKIP_EXISTING

      # The City of Helsinki's own car, bicycle and pedestrian counters. Also after a failed
      # Digitraffic fetch, since the two sources are independent.
      - name: Fetch Helsinki counters
        if: ${{ !cancelled() }}
        run: node scripts/ingest-hel.mjs --days "$DAYS"

      # The Oulu region's cycle and pedestrian counters, from Oulunliikenne.
      - name: Fetch Oulu counters
        if: ${{ !cancelled() }}
        run: node scripts/ingest-oulu.mjs --days "$DAYS"

      # Cycle and pedestrian counters on Eco-Counter's public pages: Espoo, Vantaa, Lahti, Joensuu and others.
      - name: Fetch Eco-Counter counters
        if: ${{ !cancelled() }}
        run: node scripts/ingest-eco.mjs --days "$DAYS"

      # Statens vegvesen's car and bicycle counters in Norway. Stops after NOR_MINUTES; a backfill
      # continues where it stopped when run again with skip_existing.
      - name: Fetch Norwegian counters
        if: ${{ !cancelled() }}
        run: |
          [[ "$NOR_MINUTES" =~ ^[0-9]+$ ]] || { echo "nor_minutes must be a number"; exit 1; }
          node scripts/ingest-nor.mjs --days "$DAYS" $SKIP_EXISTING --max-minutes "$NOR_MINUTES"

      # Also after a failed fetch, so stations that did succeed are kept.
      - name: Upload to R2
        if: ${{ !cancelled() }}
        run: >
          aws s3 sync data "$BUCKET" --endpoint-url "$ENDPOINT" --only-show-errors
          --content-type application/json --cache-control "public, max-age=3600"

      # 5-minute lane data for the fundamental diagrams. Only the last FD_DAYS date folders are
      # listed (not downloaded), so the script fetches just the days that are missing.
      - name: List stored lane data
        if: ${{ !cancelled() }}
        run: |
          [[ "$FD_DAYS" =~ ^[0-9]+$ ]] || { echo "fd_days must be a number"; exit 1; }
          for i in $(seq 1 "$FD_DAYS"); do
            aws s3 ls --recursive "$BUCKET/fd/$(TZ=Europe/Helsinki date -d "-$i day" +%F)/" --endpoint-url "$ENDPOINT" || true
          done > fd-keys.txt
          wc -l < fd-keys.txt

      - name: Fetch lane data from Digitraffic
        if: ${{ !cancelled() }}
        run: node scripts/ingest-fd.mjs --days "$FD_DAYS" --out fd-out --existing fd-keys.txt

      # Day files never change once written, so they are stored gzipped and cached for a day.
      - name: Upload lane data to R2
        if: ${{ !cancelled() && hashFiles('fd-out/**') != '' }}
        run: |
          find fd-out -name '*.json' -exec gzip -9 -n {} \; -exec sh -c 'mv "$1.gz" "$1"' _ {} \;
          aws s3 cp fd-out/fd "$BUCKET/fd" --recursive --endpoint-url "$ENDPOINT" --only-show-errors \
            --content-type application/json --content-encoding gzip --cache-control "public, max-age=86400"

      # The page only shows the last FD_DAYS days, so older date folders are deleted.
      - name: Delete old lane data
        run: |
          cutoff=$(TZ=Europe/Helsinki date -d "-$FD_DAYS day" +%F)
          aws s3 ls "$BUCKET/fd/" --endpoint-url "$ENDPOINT" | awk '$1 == "PRE" { sub("/$", "", $2); print $2 }' |
            while read -r day; do
              if [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$day" < "$cutoff" ]]; then
                echo "Deleting $day"
                aws s3 rm "$BUCKET/fd/$day/" --recursive --endpoint-url "$ENDPOINT" --only-show-errors
              fi
            done

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling it through the API resets that timer (the approach keepalive-workflow uses).
      - name: Keep the schedule alive
        run: gh workflow enable ingest.yml
        env:
          GH_TOKEN: ${{ github.token }}
